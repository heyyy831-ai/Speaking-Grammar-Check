<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <meta name="description" content="Lesson 0-2からLesson 4までを学べる英文法理解度チェッククイズ">
  <title>スピーキングのための英文法｜文法理解度チェッククイズ</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23c6382b'/%3E%3Cpath d='M18 17h28v7H18zm0 12h21v7H18zm0 12h28v7H18z' fill='white'/%3E%3C/svg%3E">
  <style>
:root {
  color-scheme: light;
  --bg: #f3f5fa;
  --surface: #ffffff;
  --surface-soft: #f8f9fc;
  --ink: #202b3f;
  --muted: #76839b;
  --line: #d5ddea;
  --line-strong: #c6d0e0;
  --accent: #c6382b;
  --accent-soft: #f8e6e3;
  --blue: #2566a9;
  --green: #16785c;
  --shadow: 0 18px 45px rgba(42, 55, 82, .08);
  --serif: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141922;
  --surface: #1c2330;
  --surface-soft: #202938;
  --ink: #edf1f7;
  --muted: #a5b0c2;
  --line: #394456;
  --line-strong: #4a576b;
  --accent: #ef685b;
  --accent-soft: #432925;
  --blue: #77b7f2;
  --green: #65d4ab;
  --shadow: 0 20px 50px rgba(0, 0, 0, .24);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-width: 320px;
  background:
    radial-gradient(circle at 8% 0%, color-mix(in srgb, var(--accent) 5%, transparent) 0 17rem, transparent 33rem),
    var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.75;
  transition: background-color .25s ease, color .25s ease;
}

button { font: inherit; }

button:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--blue) 55%, transparent);
  outline-offset: 3px;
}

.page-header,
.app-shell {
  width: min(1360px, calc(100% - 48px));
  margin-inline: auto;
}

.page-header { padding: 28px 0 22px; }

.eyebrow {
  margin: 0;
  color: #56647b;
  font-family: var(--serif);
  font-size: clamp(1rem, 1.5vw, 1.3rem);
  font-weight: 700;
  letter-spacing: .12em;
}

html[data-theme="dark"] .eyebrow { color: var(--muted); }

.title-wrap {
  display: grid;
  grid-template-columns: minmax(30px, 1fr) auto minmax(30px, 1fr);
  align-items: center;
  gap: 30px;
  margin: 26px 0 22px;
}

.title-rule { height: 1px; background: var(--line); }

h1 {
  margin: 0;
  padding: 0 0 10px;
  border-bottom: 3px solid var(--accent);
  color: var(--accent);
  font-family: var(--serif);
  font-size: clamp(2rem, 4.6vw, 4rem);
  font-weight: 600;
  letter-spacing: .045em;
  line-height: 1.25;
  text-align: center;
}

.app-shell { padding-bottom: 70px; }

.group-tabs {
  display: flex;
  gap: 0;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
  scrollbar-width: thin;
}

.group-tab {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  align-items: baseline;
  gap: 11px;
  min-height: 66px;
  padding: 18px 24px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-weight: 700;
  white-space: nowrap;
}

.group-tab strong { font-size: 1.05rem; letter-spacing: .025em; }
.group-tab small { font-size: .82rem; font-weight: 600; }

.group-tab[aria-selected="true"] { color: var(--ink); }
.group-tab[aria-selected="true"] strong { color: var(--accent); }
.group-tab[aria-selected="true"]::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: var(--accent);
  content: "";
}

.sublesson-wrap { padding: 20px 0 10px; }

.sublesson-tabs {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 2px 2px 9px;
  scrollbar-width: thin;
}

.sublesson-tab {
  min-width: 64px;
  padding: 9px 15px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  font-weight: 750;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(49, 62, 88, .03);
}

.sublesson-tab[aria-selected="true"] {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

.lesson-heading {
  display: flex;
  align-items: baseline;
  gap: 22px;
  padding: 28px 0 20px;
  border-bottom: 1px solid var(--line);
}

.lesson-kicker {
  color: var(--accent);
  font-family: Georgia, serif;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  white-space: nowrap;
}

h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(1.65rem, 3.3vw, 2.65rem);
  font-weight: 650;
  letter-spacing: .04em;
  line-height: 1.35;
}

.overview { padding: 34px 0 27px; }

.overview h3 {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: .96rem;
  letter-spacing: .12em;
}

.topic-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--line);
}

.topic-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  min-height: 72px;
  padding: 17px 20px;
  background: var(--surface);
}
.topic-number { color: #8b98ad; font-size: .85rem; font-weight: 800; }
.topic-text { font-weight: 650; line-height: 1.55; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 25px 0;
  border-bottom: 1px solid var(--line);
}

.progress-block {
  display: flex;
  flex: 1 1 auto;
  align-items: center;
  gap: 20px;
  min-width: 0;
}

.progress-copy {
  flex: 0 0 auto;
  margin: 0;
  color: var(--muted);
  white-space: nowrap;
}

.progress-copy strong { color: var(--accent); font-size: 1.45rem; }

.progress-track {
  position: relative;
  flex: 1 1 auto;
  height: 8px;
  overflow: hidden;
  border-radius: 99px;
  background: var(--line);
}

.progress-track span {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
  transition: width .3s ease;
}

.toolbar-actions { display: flex; flex: 0 0 auto; gap: 10px; }

.control-button,
.pager-button {
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  font-weight: 700;
  transition: transform .15s ease, border-color .15s ease, color .15s ease;
}

.control-button { padding: 9px 16px; }
.control-button:hover,
.pager-button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

.quiz-list {
  display: grid;
  gap: 18px;
  padding: 30px 0;
}

.quiz-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.card-grid { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(330px, .92fr); }

.question-panel,
.answer-panel { padding: clamp(22px, 3vw, 38px); }

.answer-panel {
  position: relative;
  border-left: 1px solid var(--line);
  background: var(--surface-soft);
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 20px;
  color: #8290a6;
  font-size: .92rem;
  font-weight: 700;
}

.question-number {
  display: inline-grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border: 2px solid var(--accent);
  border-radius: 50%;
  color: var(--accent);
  font-family: Georgia, serif;
  font-size: 1rem;
}

.question-text {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(1.05rem, 1.8vw, 1.25rem);
  font-weight: 600;
  line-height: 1.9;
}

.example {
  margin: 18px 0 0;
  padding: 15px 18px;
  border-left: 3px solid var(--line-strong);
  background: var(--surface-soft);
  color: var(--ink);
  font-family: Georgia, "Yu Mincho", serif;
  font-size: 1.04rem;
  line-height: 1.7;
  white-space: pre-line;
}

.answer-heading {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 0 0 18px;
  color: var(--accent);
  font-family: Georgia, serif;
  font-size: .9rem;
  font-weight: 800;
  letter-spacing: .18em;
}

.answer-heading::after { flex: 1; height: 1px; background: color-mix(in srgb, var(--accent) 35%, var(--line)); content: ""; }

.answer-body { min-height: 76px; }
.answer-main { margin: 0; color: var(--ink); font-size: 1.07rem; font-weight: 700; line-height: 1.85; }
.answer-main .blue { color: var(--blue); }
.answer-main .green { color: var(--green); }
.answer-note { margin: 17px 0 0; padding-top: 15px; border-top: 1px solid var(--line); color: var(--muted); font-size: .94rem; }

.answer-panel.is-hidden .answer-body { filter: blur(7px); opacity: .18; user-select: none; }
.answer-reveal {
  position: absolute;
  inset: 0;
  display: none;
  place-items: center;
  border: 0;
  background: color-mix(in srgb, var(--surface-soft) 70%, transparent);
  color: var(--accent);
  cursor: pointer;
  font-weight: 800;
}

.answer-panel.is-hidden .answer-reveal { display: grid; }

.card-actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 18px;
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 92%, var(--bg));
}

.text-button,
.check-button {
  border: 0;
  background: transparent;
  cursor: pointer;
  font-weight: 750;
}

.text-button { color: var(--muted); }
.text-button:hover { color: var(--accent); }

.check-button {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
}

.check-mark {
  display: inline-grid;
  width: 24px;
  height: 24px;
  place-items: center;
  border: 1.5px solid var(--line-strong);
  border-radius: 50%;
}

.check-button[aria-pressed="true"] { color: var(--green); }
.check-button[aria-pressed="true"] .check-mark { border-color: var(--green); background: var(--green); color: #fff; }

.lesson-pager { display: flex; justify-content: space-between; gap: 16px; padding-top: 6px; }
.pager-button { min-width: 150px; padding: 12px 18px; }
.pager-button:disabled { cursor: default; opacity: .4; transform: none; }

.empty-note { padding: 35px; text-align: center; color: var(--muted); }

@media (max-width: 1000px) {
  .topic-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toolbar { align-items: stretch; flex-direction: column; }
  .card-grid { grid-template-columns: 1fr; }
  .answer-panel { border-top: 1px solid var(--line); border-left: 0; }
}

@media (max-width: 680px) {
  .page-header,
  .app-shell { width: min(100% - 28px, 1360px); }
  .page-header { padding-top: 20px; }
  .title-wrap { grid-template-columns: 1fr; gap: 12px; margin: 18px 0 12px; }
  .title-rule { display: none; }
  h1 { text-align: left; }
  .group-tab { min-height: 58px; padding: 14px 17px; }
  .group-tab small { display: none; }
  .lesson-heading { align-items: flex-start; flex-direction: column; gap: 5px; padding-top: 20px; }
  .topic-grid { grid-template-columns: 1fr; }
  .progress-block { align-items: flex-start; flex-direction: column; gap: 10px; }
  .progress-track { flex: none; width: 100%; }
  .toolbar-actions { display: grid; grid-template-columns: 1fr 1fr; }
  .toolbar-actions .control-button:first-child { grid-column: 1 / -1; }
  .question-panel,
  .answer-panel { padding: 22px 19px; }
  .card-actions { align-items: center; }
  .lesson-pager { flex-direction: column; }
  .pager-button { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">文法理解度チェッククイズ</p>
    <div class="title-wrap">
      <span class="title-rule" aria-hidden="true"></span>
      <h1>スピーキングのための英文法</h1>
      <span class="title-rule" aria-hidden="true"></span>
    </div>
  </header>

  <main class="app-shell" id="app">
    <nav class="group-tabs" id="groupTabs" aria-label="Lessonを選ぶ"></nav>
    <div class="sublesson-wrap">
      <nav class="sublesson-tabs" id="sublessonTabs" aria-label="小Lessonを選ぶ"></nav>
    </div>

    <section class="lesson-heading" aria-labelledby="lessonTitle">
      <div class="lesson-kicker" id="lessonKicker"></div>
      <h2 id="lessonTitle"></h2>
    </section>

    <section class="overview" aria-labelledby="overviewTitle">
      <h3 id="overviewTitle">このレッスンで確認するポイント</h3>
      <div class="topic-grid" id="topicGrid"></div>
    </section>

    <section class="toolbar" aria-label="進み具合と表示設定">
      <div class="progress-block">
        <p class="progress-copy"><strong id="progressCurrent">0</strong><span id="progressTotal"> / 0問 確認済み</span></p>
        <div class="progress-track" role="progressbar" aria-label="このLessonの進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
          <span id="progressFill"></span>
        </div>
      </div>
      <div class="toolbar-actions">
        <button class="control-button" id="themeToggle" type="button" aria-pressed="false"><span aria-hidden="true">◐</span><span>ダーク</span></button>
        <button class="control-button" id="showAll" type="button">すべて表示</button>
        <button class="control-button" id="hideAll" type="button">すべて隠す</button>
      </div>
    </section>

    <section class="quiz-list" id="quizList" aria-label="理解度チェック問題"></section>
    <nav class="lesson-pager" aria-label="前後のLessonへ移動">
      <button type="button" id="prevLesson" class="pager-button">← 前のLesson</button>
      <button type="button" id="nextLesson" class="pager-button">次のLesson →</button>
    </nav>
  </main>

  <noscript>このアプリを使うにはJavaScriptを有効にしてください。</noscript>
  <script>
const q = (topic, question, example, answer, note) => ({ topic, question, example, answer, note });

const GROUPS = [
  { id: "0", label: "Lesson 0", count: "1 lesson" },
  { id: "1", label: "Lesson 1", count: "11 lessons" },
  { id: "2", label: "Lesson 2", count: "7 lessons" },
  { id: "3", label: "Lesson 3", count: "6 lessons" },
  { id: "4", label: "Lesson 4", count: "10 lessons" }
];

const SOURCE_LESSONS = [
  {
    id: "0-2", group: "0", title: "文の骨組みと品詞",
    themes: ["主語（主部）と述部", "名詞・代名詞の働き", "形容詞・冠詞の働き", "副詞の働き", "動詞・補語・目的語"],
    cards: [
      q("主語（主部）と述部", "文は、主語と、主語の状態や動作について述べる述部に分かれます。次の文の主語と述部を答えなさい。", "Jane is in the car.", `<span class="blue">主語：Jane</span><br><span class="green">述部：is in the car</span>`, "述部は動詞から後ろ全部です。Jane（だれが）＋ is in the car（どうしている）の二つに分けます。"),
      q("名詞と代名詞", "名詞と代名詞は、それぞれどのような働きをしますか。次の文ではどれが代名詞ですか。", "Sally is from America. She is in Kyoto now.", `名詞は人・物・事柄などの<span class="blue">名前</span>を表します。代名詞は名詞の<span class="green">繰り返しを避ける</span>語で、この文では <strong>She</strong> です。`, "Sally をもう一度言わず、She で受けています。"),
      q("形容詞と冠詞", "形容詞と冠詞は名詞に対してどのように働きますか。", "Jane is a pretty girl.", `<strong>pretty</strong> は名詞 girl の性質を述べる<span class="blue">形容詞</span>、<strong>a</strong> は名詞の前で範囲を定める<span class="green">冠詞</span>です。`, "形容詞は名詞を直接修飾するほか、Jane is pretty. のように補語にもなります。"),
      q("a と an", "不定冠詞 a ではなく an を使うのは、後ろの語がどのような音で始まるときですか。", "an apple / an hour / a university", `<span class="blue">母音の音</span>で始まるときは <strong>an</strong>、子音の音で始まるときは <strong>a</strong> です。`, "つづりではなく発音で決めます。hour は母音で始まり、university は /j/ という子音で始まります。"),
      q("副詞", "次の文の副詞（句）を挙げ、それぞれ何を修飾しているか答えなさい。", "I am at school.\nThe PC is very good.", `<strong>at school</strong> は動詞 <strong>am</strong> を、<strong>very</strong> は形容詞 <strong>good</strong> を修飾しています。`, "副詞は主に動詞・形容詞・ほかの副詞、または文全体を修飾します。"),
      q("述語の中心", "述語の中心になる品詞は何ですか。次の文ではどの語ですか。", "Liz is very pretty.", `述語の中心は<span class="blue">動詞</span>で、この文では <strong>is</strong> です。`, "英語の文には原則として述語動詞が必要です。"),
      q("補語と目的語", "補語を取る動詞と目的語を取る動詞の違いを、次の2文で説明しなさい。", "Mary is a doctor.\nMary sees a doctor.", `第1文の <strong>a doctor</strong> は主語 Mary とイコールになる<span class="blue">補語</span>。第2文では「見る対象」なので<span class="green">目的語</span>です。`, "補語なら Mary = a doctor、目的語なら Mary ≠ a doctor です。"),
      q("補語の品詞", "次の各文で補語を示し、その品詞または句の種類を答えなさい。", "Mary is a doctor.\nThey are tall.\nThe students are in the classroom.", `<strong>a doctor</strong>＝名詞、<strong>tall</strong>＝形容詞、<strong>in the classroom</strong>＝場所を表す前置詞句です。`, "補語は主語が「何であるか」「どんな状態か」「どこにいるか」を補足します。"),
      q("四つの主要品詞", "英文を組み立てる中心的な四つの品詞と、それぞれの基本的な働きを答えなさい。", "noun / adjective / verb / adverb", `<strong>名詞</strong>＝主語など、<strong>形容詞</strong>＝名詞を修飾、<strong>動詞</strong>＝状態・動作を述べる、<strong>副詞</strong>＝名詞以外を修飾します。`, "まずこの四つの役割を見分けると、文の骨組みが見えやすくなります。"),
      q("人称代名詞とbe動詞", "主語に合うbe動詞を入れなさい。", "I (   ) a student. / You (   ) kind.\nHe (   ) a doctor. / They (   ) teachers.", `<strong>I am</strong> / <strong>You are</strong> / <strong>He is</strong> / <strong>They are</strong>`, "現在形は am・is・are、過去形は was・wereを主語に合わせます。"),
      q("否定文と疑問文", "be動詞の文を否定文・疑問文にする方法を説明し、短い答えも完成させなさい。", "She is Sally. → 否定文 / 疑問文\nIs she Sally? — Yes, (   ). / No, (   ).", `否定文：<strong>She is not Sally.</strong><br>疑問文：<strong>Is she Sally?</strong><br>答え：<strong>Yes, she is. / No, she isn't.</strong>`, "否定はbe動詞の後ろに not、疑問はbe動詞を主語の前に出します。")
    ]
  },
  {
    id: "2-1", group: "2", title: "疑問文・義務の助動詞・第四文型",
    themes: ["否定疑問文", "付加疑問文・選択疑問文", "shall・should・must", "mustとhave to", "第四文型（SVOO）"],
    cards: [
      q("否定疑問文", "否定疑問文はどのような気持ちを表しますか。", "Didn't I tell you about it?\nCan't Sally drive a car?", `「言ったよね」「運転できないの？」のように、話し手の<span class="blue">予想・驚き・確認</span>を表します。`, "日本語の「はい・いいえ」ではなく、内容が肯定なら Yes、否定なら No で答えます。"),

      q("受動態の進行形", "能動文を受動態の進行形にしなさい。", "They are repairing his car.\nThey are painting the building white.", `<strong>His car is being repaired.</strong><br><strong>The building is being painted white.</strong>`, "形は be＋being＋過去分詞。動作が今進行中であることと、受け身を同時に示します。"),
      q("英語特有の受動表現", "自然な受動表現で英訳しなさい。", "「空港では祖父が迎えてくれた」／「月が水面に映っていた」", `<strong>I was met by my grandfather at the airport.</strong><br><strong>The moon was reflected in the water.</strong>`, "日本語では能動的に言う内容でも、英語では焦点に応じて受動態が自然になる場合があります。"),
      q("分詞由来の形容詞", "closed が形容詞と受動態になる違いを説明しなさい。", "The store is closed on Mondays.\nThe store is closed at seven.", `第1文は店の<span class="blue">状態・営業日</span>を表す形容詞、第2文は「7時に閉められる」という<span class="green">動作の受動態</span>に読めます。`, "形だけでなく、状態を述べるのか、動作と時点を述べるのかで判断します。"),
      q("形容詞＋前置詞", "適切な前置詞を入れなさい。", "accustomed (   ) change / devoted (   ) her family / qualified (   ) a teacher", `<strong>accustomed to</strong> change / <strong>devoted to</strong> her family / <strong>qualified as</strong> a teacher`, "分詞由来の形容詞は、結びつく前置詞まで一まとまりで覚えます。"),
      q("複合形容詞", "語をつないで名詞を修飾する形にしなさい。", "age + old problem / eye + catching design / full + time teacher / ready + made food", `<strong>age-old problem / eye-catching design / full-time teacher / ready-made food</strong>`, "複数語を一つの形容詞として名詞の前に置くとき、ハイフンで結ぶ形がよく使われます。")
    ]
  },
  {
    id: "4-8", group: "4", title: "副詞と疑問詞の慣用表現",
    themes: ["不定詞・動名詞を取る形容詞", "副詞＋形容詞", "副詞＋副詞", "副詞の慣用表現", "疑問詞の慣用表現"],
    cards: [
      q("形容詞＋不定詞／動名詞", "ほぼ同じ内容を二つの形で表しなさい。", "「彼女は彼にお金を頼むのを恥じた」", `<strong>She was ashamed to ask him for money.</strong><br><strong>She was ashamed of asking him for money.</strong>`, "afraid、ashamed、fortunate、quick、slow などは、不定詞と前置詞＋動名詞の両方を取ることがあります。"),
      q("強める副詞", "形容詞を強める副詞を挙げ、自然な組み合わせを作りなさい。", "pretty / awfully / amazingly / deeply / highly / extremely / totally", `<strong>pretty interesting / awfully sorry / amazingly big / deeply concerned / highly intelligent / extremely dangerous / totally natural</strong>`, "同じ「とても」でも、形容詞との相性や改まり度が異なります。"),
      q("弱める副詞", "弱める副詞のニュアンスを答えなさい。", "a bit / somewhat / rather / nearly / relatively", `<strong>a bit</strong>＝少し、<strong>somewhat</strong>＝いくぶん、<strong>rather</strong>＝やや、<strong>nearly</strong>＝ほとんど、<strong>relatively</strong>＝比較的、です。`, "評価を断定しすぎず、程度を細かく調整します。"),
      q("副詞＋副詞", "前の副詞が後ろを強めている組み合わせを示しなさい。", "right now / right here / pretty much / pretty soon / really well", `<strong>right</strong> が now / here を、<strong>pretty</strong> が much / soon を、<strong>really</strong> が well を強めています。`, "副詞は動詞・形容詞だけでなく、ほかの副詞も修飾します。"),
      q("文全体をつなぐ副詞句", "意味を答えなさい。", "In general / In my view / In short / In fact / In other words", `<strong>一般に</strong>／<strong>私の考えでは</strong>／<strong>要するに</strong>／<strong>実は</strong>／<strong>言い換えれば</strong>です。`, "発言の立場・要約・補足・言い換えを示し、会話や文章の流れを作ります。"),
      q("What if ...?", "意味を答え、英訳しなさい。", "What if he fails? / 「雨が降ったらどうする？」", `<strong>What if he fails?</strong>＝彼が失敗したらどうする？<br><strong>What if it rains?</strong>`, "What will happen if ...? を短くした会話的な表現です。"),
      q("会話を始める疑問詞表現", "二つの表現の主な使い方を答えなさい。", "I'll tell you what. / You know what?", `<strong>I'll tell you what.</strong> は提案を切り出す「あのね／こうしよう」、<strong>You know what?</strong> は話題を始める「ねえ、聞いて」です。`, "語を直訳するより、会話の機能として覚えると自然です。"),
      q("what・which の慣用表現", "意味を答えなさい。", "What's the matter? / What's up? / Which is which? / Where was I?", `<strong>どうしたの</strong>／<strong>どう？・何があったの</strong>／<strong>どちらがどちら</strong>／<strong>どこまで話したっけ</strong>です。`, "状況とイントネーションで意味が変わる、頻度の高い会話表現です。"),
      q("how の慣用表現", "標準的な語順に注意して意味を答えなさい。", "How come you're using my PC? / How about eating out? / How about you?", `<strong>どうして私のPCを使っているの</strong>／<strong>外食するのはどう</strong>／<strong>あなたはどう</strong>です。`, "How come の後ろは疑問倒置をせず、主語＋動詞の語順になります。")
    ]
  },
  {
    id: "4-9", group: "4", title: "部分詞・主要動詞・無生物主語・should",
    themes: ["部分詞とof句", "have・getのイディオム", "make・takeのイディオム", "無生物主語", "感情のshould", "仮定法現在"],
    cards: [
      q("部分詞＋of", "of句を伴う部分表現で、動詞の数を何に合わせるか説明しなさい。", "One of us is ... / Many of them are ... / Some of the water is ...", `中心になる部分詞に合わせ、<strong>one</strong> は単数、<strong>many</strong> は複数、<strong>some of＋不可算名詞</strong> は単数として扱います。`, "one / many / which / the biggest などが名詞句の中心になり、of句が全体・集団を示します。"),
      q("of句の中心語", "どの語がどの語を修飾するか説明しなさい。", "three days of discussion / all kinds of allergies / a broad range of knowledge", `前の数量・種類・範囲の表現が、後ろの中心名詞 <strong>discussion / allergies / knowledge</strong> を修飾します。`, "of をすべて日本語の「〜の」と同じ順序で読むと、中心を取り違えることがあります。"),
      q("have のイディオム", "意味を答えなさい。", "have a look / have had it with ... / have no idea / have someone over", `<strong>見る</strong>／<strong>〜にはうんざりだ</strong>／<strong>まったく分からない</strong>／<strong>人を家に招く</strong>です。`, "基本動詞 have は、目的語との組み合わせで多くの会話表現を作ります。"),
      q("get のイディオム", "意味を答えなさい。", "get back / get by / get in touch with / get over / get rid of", `<strong>戻る</strong>／<strong>何とかやっていく</strong>／<strong>〜と連絡・接触する</strong>／<strong>克服する</strong>／<strong>取り除く</strong>です。`, "副詞・前置詞まで含めたまとまりで意味を覚えます。"),
      q("make のイディオム", "意味を答えなさい。", "make a living / make a mistake / make it / make sense / make up one's mind", `<strong>生計を立てる</strong>／<strong>間違える</strong>／<strong>間に合う・都合がつく</strong>／<strong>意味をなす</strong>／<strong>決心する</strong>です。`, "make it up to someone は「人に埋め合わせをする」です。"),
      q("take のイディオム", "意味を答えなさい。", "take a look / take care of / take off / take over / take part in / take turns", `<strong>見る</strong>／<strong>世話をする</strong>／<strong>離陸する</strong>／<strong>引き継ぐ</strong>／<strong>参加する</strong>／<strong>交代でする</strong>です。`, "take time は「時間がかかる」、take it hard は「ひどくショックを受ける」です。"),
      q("無生物主語", "人を主語にせず自然な英語にしなさい。", "「この道を行けば町に着きますか」／「これは大学時代を思い出させる」", `<strong>Will this road take us into town?</strong><br><strong>This reminds me of my college days.</strong>`, "英語では原因・手段・条件となる物事を主語にし、それが人に作用する形をよく使います。"),
      q("感情の should", "should の有無によるニュアンスを説明しなさい。", "I'm surprised that you (should) say that.", `<strong>should</strong> があると話し手の驚き・評価がより前面に出ます。ない形は出来事を比較的客観的に述べます。`, "surprised、strange、a pity など、感情・評価を表す語の that節に現れます。"),
      q("仮定法現在", "that節の動詞の形を完成させなさい。", "It is essential that she (think) for herself.\nThey requested that we (leave) a comment.", `<strong>think / leave</strong> と原形を使います。`, "提案・要求・必要を表す名詞・形容詞・動詞の後では、that節に（should＋）動詞の原形を使います。"),
      q("提案・要求の強さ", "本書の並びに沿って、控えめな提案から強い要求へ並べなさい。", "suggest / propose / recommend / ask / require / demand", `<strong>suggest → propose → recommend → ask → require → demand</strong>`, "実際の強さは文脈にもよりますが、that節ではどれも（should＋）原形を取れます。")
    ]
  }
];

const targetIds = [
  ...Array.from({ length: 11 }, (_, index) => `1-${index + 1}`),
  ...Array.from({ length: 7 }, (_, index) => `2-${index + 1}`),
  ...Array.from({ length: 6 }, (_, index) => `3-${index + 1}`)
];

const shiftedSource = [...SOURCE_LESSONS]
  .filter((lesson) => lesson.id !== "3-6")
  .sort((a, b) => {
    const [ag, as] = a.id.split("-").map(Number);
    const [bg, bs] = b.id.split("-").map(Number);
    return ag - bg || as - bs;
  });

const LESSONS = [
  GREETING_LESSON,
  ...shiftedSource.map((lesson, index) => ({
    ...lesson,
    id: targetIds[index],
    group: targetIds[index].split("-")[0]
  })),
  ...LESSON4_LESSONS
];

const orderedLessons = [...LESSONS].sort((a, b) => {
  const [ag, as] = a.id.split("-").map(Number);
  const [bg, bs] = b.id.split("-").map(Number);
  return ag - bg || as - bs;
});

const byId = new Map(orderedLessons.map((lesson) => [lesson.id, lesson]));
const storageKey = "speaking-grammar-check-progress-v2";
const themeKey = "speaking-grammar-check-theme-v1";

function safeGet(key) {
  try { return localStorage.getItem(key); }
  catch { return null; }
}

function safeSet(key, value) {
  try { localStorage.setItem(key, value); }
  catch { /* The quiz still works when file previews block local storage. */ }
}

let savedProgress = {};
try {
  savedProgress = JSON.parse(safeGet(storageKey) || "{}") || {};
} catch {
  savedProgress = {};
}

const hashId = decodeURIComponent(location.hash.replace(/^#/, ""));
let currentId = byId.has(hashId) ? hashId : "0-2";
let revealed = new Set([0]);

const els = {
  groupTabs: document.querySelector("#groupTabs"),
  sublessonTabs: document.querySelector("#sublessonTabs"),
  lessonKicker: document.querySelector("#lessonKicker"),
  lessonTitle: document.querySelector("#lessonTitle"),
  topicGrid: document.querySelector("#topicGrid"),
  quizList: document.querySelector("#quizList"),
  progressCurrent: document.querySelector("#progressCurrent"),
  progressTotal: document.querySelector("#progressTotal"),
  progressBar: document.querySelector("#progressBar"),
  progressFill: document.querySelector("#progressFill"),
  themeToggle: document.querySelector("#themeToggle"),
  showAll: document.querySelector("#showAll"),
  hideAll: document.querySelector("#hideAll"),
  prevLesson: document.querySelector("#prevLesson"),
  nextLesson: document.querySelector("#nextLesson")
};

function getCompleted(id = currentId) {
  return new Set(Array.isArray(savedProgress[id]) ? savedProgress[id] : []);
}

function persistCompleted(id, set) {
  savedProgress[id] = [...set].sort((a, b) => a - b);
  safeSet(storageKey, JSON.stringify(savedProgress));
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const dark = theme === "dark";
  els.themeToggle.setAttribute("aria-pressed", String(dark));
  els.themeToggle.lastElementChild.textContent = dark ? "ライト" : "ダーク";
  safeSet(themeKey, theme);
}

function renderGroupTabs() {
  const group = byId.get(currentId).group;
  els.groupTabs.innerHTML = GROUPS.map((item) => `
    <button class="group-tab" type="button" role="tab" data-group="${item.id}" aria-selected="${item.id === group}">
      <strong>${item.label}</strong><small>${item.count}</small>
    </button>
  `).join("");

  els.groupTabs.querySelectorAll("button").forEach((button) => {
    button.addEventListener("click", () => {
      const first = orderedLessons.find((lesson) => lesson.group === button.dataset.group);
      if (first) selectLesson(first.id, true);
    });
  });
}

function renderSublessonTabs() {
  const group = byId.get(currentId).group;
  const groupLessons = orderedLessons.filter((lesson) => lesson.group === group);
  els.sublessonTabs.innerHTML = groupLessons.map((lesson) => `
    <button class="sublesson-tab" type="button" role="tab" data-id="${lesson.id}" aria-selected="${lesson.id === currentId}">${lesson.id}</button>
  `).join("");

  els.sublessonTabs.querySelectorAll("button").forEach((button) => {
    button.addEventListener("click", () => selectLesson(button.dataset.id, true));
  });
  els.sublessonTabs.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest", inline: "center" });
}

function renderTopics(lesson) {
  els.topicGrid.innerHTML = lesson.themes.map((theme, index) => `
    <div class="topic-item"><span class="topic-number">${index + 1}</span><span class="topic-text">${theme}</span></div>
  `).join("");
}

function renderCards(lesson) {
  const completed = getCompleted();
  els.quizList.innerHTML = lesson.cards.map((card, index) => {
    const isRevealed = revealed.has(index);
    const isDone = completed.has(index);
    const answerId = `answer-${lesson.id}-${index}`;
    return `
      <article class="quiz-card" data-index="${index}">
        <div class="card-grid">
          <div class="question-panel">
            <div class="card-meta"><span class="question-number">${index + 1}</span><span>${card.topic}</span></div>
            <p class="question-text">${card.question}</p>
            ${card.example ? `<div class="example">${card.example}</div>` : ""}
          </div>
          <div class="answer-panel ${isRevealed ? "" : "is-hidden"}" id="${answerId}">
            <p class="answer-heading">ANSWER</p>
            <div class="answer-body">
              <p class="answer-main">${card.answer}</p>
              <p class="answer-note">${card.note}</p>
            </div>
            <button type="button" class="answer-reveal" data-action="reveal" aria-controls="${answerId}">答えを見る</button>
          </div>
        </div>
        <div class="card-actions">
          <button type="button" class="text-button" data-action="toggle-answer" aria-expanded="${isRevealed}" aria-controls="${answerId}">${isRevealed ? "答えを隠す" : "答えを見る"}</button>
          <button type="button" class="check-button" data-action="check" aria-pressed="${isDone}"><span class="check-mark" aria-hidden="true">${isDone ? "✓" : ""}</span><span>${isDone ? "確認済み" : "確認する"}</span></button>
        </div>
      </article>
    `;
  }).join("");

  els.quizList.querySelectorAll(".quiz-card").forEach((card) => {
    const index = Number(card.dataset.index);
    card.querySelectorAll('[data-action="reveal"], [data-action="toggle-answer"]').forEach((button) => {
      button.addEventListener("click", () => toggleAnswer(index));
    });
    card.querySelector('[data-action="check"]').addEventListener("click", () => toggleCompleted(index));
  });
}

function updateProgress(lesson = byId.get(currentId)) {
  const count = getCompleted().size;
  const total = lesson.cards.length;
  const percent = total ? Math.round((count / total) * 100) : 0;
  els.progressCurrent.textContent = count;
  els.progressTotal.textContent = ` / ${total}問 確認済み`;
  els.progressBar.setAttribute("aria-valuenow", String(percent));
  els.progressBar.setAttribute("aria-valuetext", `${total}問中${count}問確認済み`);
  els.progressFill.style.width = `${percent}%`;
}

function toggleAnswer(index) {
  if (revealed.has(index)) revealed.delete(index);
  else revealed.add(index);
  renderCards(byId.get(currentId));
}

function toggleCompleted(index) {
  const completed = getCompleted();
  if (completed.has(index)) completed.delete(index);
  else completed.add(index);
  persistCompleted(currentId, completed);
  renderCards(byId.get(currentId));
  updateProgress();
}

function updatePager() {
  const index = orderedLessons.findIndex((lesson) => lesson.id === currentId);
  els.prevLesson.disabled = index <= 0;
  els.nextLesson.disabled = index >= orderedLessons.length - 1;
  els.prevLesson.dataset.target = orderedLessons[index - 1]?.id || "";
  els.nextLesson.dataset.target = orderedLessons[index + 1]?.id || "";
}

function selectLesson(id, shouldScroll = false) {
  if (!byId.has(id)) return;
  currentId = id;
  revealed = new Set([0]);
  const lesson = byId.get(id);
  history.replaceState(null, "", `#${encodeURIComponent(id)}`);
  document.title = `${id} ${lesson.title}｜スピーキングのための英文法`;
  els.lessonKicker.textContent = `LESSON ${id}`;
  els.lessonTitle.textContent = lesson.title;
  renderGroupTabs();
  renderSublessonTabs();
  renderTopics(lesson);
  renderCards(lesson);
  updateProgress(lesson);
  updatePager();
  if (shouldScroll) document.querySelector(".group-tabs").scrollIntoView({ behavior: "smooth", block: "start" });
}

els.showAll.addEventListener("click", () => {
  revealed = new Set(byId.get(currentId).cards.map((_, index) => index));
  renderCards(byId.get(currentId));
});

els.hideAll.addEventListener("click", () => {
  revealed = new Set();
  renderCards(byId.get(currentId));
});

els.themeToggle.addEventListener("click", () => {
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

els.prevLesson.addEventListener("click", () => selectLesson(els.prevLesson.dataset.target, true));
els.nextLesson.addEventListener("click", () => selectLesson(els.nextLesson.dataset.target, true));

window.addEventListener("hashchange", () => {
  const nextId = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (byId.has(nextId) && nextId !== currentId) selectLesson(nextId);
});

const preferredTheme = safeGet(themeKey)
  || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
setTheme(preferredTheme);
selectLesson(currentId);

</script>
</body>
</html>
